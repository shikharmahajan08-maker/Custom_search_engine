<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Search Engine</title>
    <meta name="description" content="A blazing fast WebAssembly-powered C++ search engine.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="container">
        <header>
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <h1>Search<span>Photon</span></h1>
            </div>
            <p class="subtitle">Lightning-fast local C++ search engine running entirely in your browser.</p>
        </header>

        <div class="search-container">
            <div class="search-box">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="Search for machine learning, quantum computing..."
                    autocomplete="off">
                <div class="kbd-shortcut">/</div>
            </div>

            <div class="stats-panel" id="statsPanel">
                <div class="stat">
                    <span class="stat-label">Documents</span>
                    <span class="stat-value" id="statDocs">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Vocabulary</span>
                    <span class="stat-value" id="statVocab">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Total Tokens</span>
                    <span class="stat-value" id="statTokens">-</span>
                </div>
            </div>
        </div>

        <div class="results-container">
            <div id="loadingIndicator" class="loading hidden">
                <div class="spinner"></div>
                <p>Searching...</p>
            </div>

            <div class="results-meta hidden" id="resultsMeta">
                Found <span id="resultCount">0</span> results in <span id="searchTime">0</span>ms
            </div>

            <div id="resultsList" class="results-list">
                <!-- Results injected here -->
            </div>

            <div id="emptyState" class="empty-state">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.2)"
                    stroke-width="1.5">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                    <line x1="8" y1="21" x2="16" y2="21"></line>
                    <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
                <p>Waiting for your query...</p>
            </div>
        </div>
    </main>

    <div id="initOverlay" class="init-overlay">
        <div class="init-content">
            <div class="spinner large"></div>
            <h2>Initializing WebAssembly Engine...</h2>
            <p>Loading C++ module and corpus into virtual file system</p>
        </div>
    </div>

    <!-- The WebAssembly output JS will be generated by Emscripten -->
    <script src="app.js"></script>
    <script async src="search_engine.js"></script>
</body>

</html>
